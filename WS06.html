<!DOCTYPE html>
<html lang="fi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bootstrap Tehtävä</title>

  
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
  />
</head>

<body>


<nav class="navbar navbar-expand-lg navbar-light bg-light">
  <div class="container-fluid">
    <a class="navbar-brand" href="#">Brand</a>

    <button class="navbar-toggler" type="button"
      data-bs-toggle="collapse"
      data-bs-target="#navbarNav"
      aria-controls="navbarNav"
      aria-expanded="false"
      aria-label="Toggle navigation">
      <span class="navbar-toggler-icon"></span>
    </button>

    <div class="collapse navbar-collapse" id="navbarNav">
      <ul class="navbar-nav me-auto mb-2 mb-lg-0">

        <li class="nav-item">
          <a class="nav-link active" aria-current="page" href="#">Home</a>
        </li>

        <li class="nav-item">
          <a class="nav-link" href="#">About</a>
        </li>

        <li class="nav-item">
          <a class="nav-link" href="#">Contact</a>
        </li>

      </ul>
    </div>
  </div>
</nav>


<div class="container mt-4">
  <div class="alert alert-warning" role="alert">
    This is a warning alert—check it out!
  </div>
</div>


<div class="container mt-4">
  <div class="row">

    <div class="col-md-4 col-12 p-3 border text-center">
      Column 1
    </div>

    <div class="col-md-4 col-12 p-3 border text-center">
      Column 2
    </div>

    <div class="col-md-4 col-12 p-3 border text-center">
      Column 3
    </div>

  </div>
</div>


<div class="container mt-4">
  <button class="btn btn-primary me-2">Primary</button>
  <button class="btn btn-secondary me-2">Secondary</button>
  <button class="btn btn-success">Success</button>
</div>


<div class="container mt-5 mb-5">
  <div class="card" style="width: 18rem;">

    <img
      src="https://ekomatkaajat.fi/wp-content/uploads/2022/05/merikilpikonnan_suojelu_kreikka.jpg"
      class="card-img-top"
      alt="Sea turtle"
    />

    <div class="card-body">
      <h5 class="card-title">Card Title</h5>
      <p class="card-text">
        This is a simple card example using Bootstrap.
      </p>
      <a href="#" class="btn btn-primary">Learn More</a>
    </div>

  </div>
</div>


<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
